<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Training Platform Reviews, scored on the B.R.E.A.C.H. scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>

  <rect x="0.5" y="0.5" width="899" height="189" rx="14" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 96,1 L 16,81 Z" fill="#FF2A6D" opacity="0.10"/>
  <path d="M 884,189 L 804,189 L 884,109 Z" fill="#00F0FF" opacity="0.08"/>

  <g transform="translate(36,30)">
    <rect x="0" y="0" width="214" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.12" stroke="#FF2A6D" stroke-opacity="0.5"/>
    <text x="107" y="14" fill="#FF2A6D" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">AFTER ACTION REPORTS</text>
  </g>

  <text x="36" y="98" fill="url(#hero)" font-size="38" font-weight="700" filter="url(#glow)">TRAINING PLATFORM REVIEWS</text>
  <text x="38" y="128" fill="#A479C4" font-size="13" font-weight="600" letter-spacing="1.2">LIVE-FIRE · CYBER RANGES · TEAM IR EXERCISES</text>

  <!-- letter chips -->
  <g transform="translate(38,146)" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="22" height="20" rx="4" fill="#FF2A6D" fill-opacity="0.18" stroke="#FF2A6D" stroke-opacity="0.6"/><text x="11" y="14" fill="#FF2A6D">B</text>
    <rect x="28" y="0" width="22" height="20" rx="4" fill="#FF2A6D" fill-opacity="0.18" stroke="#FF2A6D" stroke-opacity="0.6"/><text x="39" y="14" fill="#FF2A6D">R</text>
    <rect x="56" y="0" width="22" height="20" rx="4" fill="#A479C4" fill-opacity="0.18" stroke="#A479C4" stroke-opacity="0.6"/><text x="67" y="14" fill="#A479C4">E</text>
    <rect x="84" y="0" width="22" height="20" rx="4" fill="#00F0FF" fill-opacity="0.14" stroke="#00F0FF" stroke-opacity="0.6"/><text x="95" y="14" fill="#00F0FF">A</text>
    <rect x="112" y="0" width="22" height="20" rx="4" fill="#A479C4" fill-opacity="0.18" stroke="#A479C4" stroke-opacity="0.6"/><text x="123" y="14" fill="#A479C4">C</text>
    <rect x="140" y="0" width="22" height="20" rx="4" fill="#00F0FF" fill-opacity="0.14" stroke="#00F0FF" stroke-opacity="0.6"/><text x="151" y="14" fill="#00F0FF">H</text>
    <text x="178" y="14" fill="#F8E8FF" fill-opacity="0.6" font-size="10" text-anchor="start" letter-spacing="1.5">SCORED ON THE B.R.E.A.C.H. SCALE</text>
  </g>

  <rect x="36" y="178" width="828" height="1" fill="url(#rule)"/>
</svg>
